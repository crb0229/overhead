# Downloads fresh satellite orbit data once a day.
name: Update orbit data

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download orbit data
        run: |
          mkdir -p data
          date -u > data/status.txt
          for pair in stations:stations visual:visual starlink:starlink active:active last30:tle-new+last-30-days; do
            g="${pair%%:*}"
            names="${pair##*:}"
            for name in ${names//+/ }; do
              url="https://celestrak.org/NORAD/elements/gp.php?GROUP=${name}&FORMAT=tle"
              code=$(curl --silent --max-time 90 -o "data/${g}.tmp" -w '%{http_code}' "$url" || echo fail)
              echo "${g} (${name}) http=${code} bytes=$(wc -c < "data/${g}.tmp" 2>/dev/null || echo 0)" >> data/status.txt
              if [ "$g" = "active" ] && [ "$code" = "200" ]; then
                # Starlink has its own file, so drop it here to keep this one small
                paste -d'|' - - - < "data/${g}.tmp" | grep -v '^STARLINK' | tr '|' '\n' > "data/${g}.flt" && mv "data/${g}.flt" "data/${g}.tmp"
                echo "active after dropping Starlink: bytes=$(wc -c < "data/${g}.tmp")" >> data/status.txt
              fi
              if [ "$code" = "200" ] && grep -q '^1 ' "data/${g}.tmp"; then
                mv "data/${g}.tmp" "data/${g}.tle"
                break
              fi
              echo "Skipping ${g} (${name}): download failed"
              head -c 300 "data/${g}.tmp" >> data/status.txt 2>/dev/null || true
              echo >> data/status.txt
              rm -f "data/${g}.tmp"
            done
          done
          test -s data/stations.tle

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update orbit data"
          git push
