# Downloads fresh satellite orbit data once a day.
name: Update orbit data

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download orbit data
        run: |
          mkdir -p data
          for pair in stations:stations visual:visual starlink:starlink last30:last-30-days; do
            g="${pair%%:*}"
            name="${pair##*:}"
            url="https://celestrak.org/NORAD/elements/gp.php?GROUP=${name}&FORMAT=tle"
            if curl --fail --silent --show-error --max-time 90 -o "data/${g}.tmp" "$url" && grep -q '^1 ' "data/${g}.tmp"; then
              mv "data/${g}.tmp" "data/${g}.tle"
            else
              echo "Skipping ${g}: download failed"
              rm -f "data/${g}.tmp"
            fi
          done
          test -s data/stations.tle

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update orbit data"
          git push
